[package]
name = "data-analysis-with-rust-book"
version = "0.1.0"
edition = "2024"

[lib]
name = "data_analysis_with_rust_book"

[[bin]]
name = "data-analysis-with-rust-book"
path = "src/bin/main.rs"

[[example]]
name = "etl_example"
path = "examples/etl_only.rs"

[[example]]
name = "summary_demo"
path = "examples/summary_demo.rs"

[dependencies]
anyhow = "1.0.86"
aws-sdk-s3 = { version = "1.111.0", features = ["behavior-version-latest"] }
clap = { version = "4.5.51", features = ["string", "derive"] }
# comrak = "0.47.0"
connectorx = { version = "0.4.4", features = ["src_postgres", "dst_polars"] }
# hypors = "0.3.0"
# plotlars = { version = "0.10.4", features = [
#   "static_export_geckodriver",
#   "static_export_wd_download",
# ] }
# Need to stick with 0.51 as there's a dependency incompatibility with 0.52
polars = { version = "0.51.0", features = [
  # "abs",          # Absolute value
  "aws",   # Read/write cloud (minio)
  "cloud",
  "csv",   # Read/write CSVs
  # "cum_agg",      # Cumulative aggregate statistics
  # "fmt",          # Format tables as markdown
  "is_in",   # List filter
  "lazy",    # LazyFrame
  "parquet", # Parquet files
  # "pivot",        # Pivot data
  # "regex",        # Call columns with regex
  # "replace",      # Replace value
  # "round_series", # Round values
] }
rand = "0.9.2"
rand_chacha = "0.9.0"
# rust_xlsxwriter = "0.92.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.48.0", features = ["rt"] }
# zip = "6.0.0"
reqwest = { version = "0.12.24", features = ["rustls-tls", "json"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
async-trait = "0.1.89"
